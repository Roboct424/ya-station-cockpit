[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/doctor",
    "crates/net",
    "crates/scenarios",
    "crates/intercept",
    "crates/ota",
    "crates/capture",
    "crates/device",
    "crates/pairing",
    "crates/cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Roboct424"]
repository = "https://github.com/Roboct424/ya-station-cockpit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
notify = "8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
sha2 = "0.10"
arc-swap = "1"

cockpit-core = { path = "crates/core" }
cockpit-config = { path = "crates/config" }
cockpit-doctor = { path = "crates/doctor" }
cockpit-net = { path = "crates/net" }
cockpit-scenarios = { path = "crates/scenarios" }
cockpit-intercept = { path = "crates/intercept" }
cockpit-ota = { path = "crates/ota" }
cockpit-capture = { path = "crates/capture" }
cockpit-device = { path = "crates/device" }
cockpit-pairing = { path = "crates/pairing" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

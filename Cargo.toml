[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/doctor",
    "crates/net",
    "crates/scenarios",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Roboct424"]
repository = "https://github.com/Roboct424/ya-station-cockpit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"
notify = "8"
arc-swap = "1"

cockpit-core = { path = "crates/core" }
cockpit-config = { path = "crates/config" }
cockpit-doctor = { path = "crates/doctor" }
cockpit-net = { path = "crates/net" }
cockpit-scenarios = { path = "crates/scenarios" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

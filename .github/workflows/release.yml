name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cockpit-windows-x86_64.zip
          - os: ubuntu-latest
            asset: cockpit-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --bin cockpit

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/cockpit | Out-Null
          New-Item -ItemType Directory -Force -Path dist/cockpit/data | Out-Null
          Copy-Item target/release/cockpit.exe, cockpit.cmd, cockpit.ps1, packaging/windows/README.txt dist/cockpit
          Copy-Item data/manifests.json dist/cockpit/data/manifests.json
          Compress-Archive -Path dist/cockpit/* -DestinationPath cockpit-windows-x86_64.zip

      - name: package (linux)
        if: runner.os == 'Linux'
        run: tar -czf cockpit-linux-x86_64.tar.gz -C target/release cockpit

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
